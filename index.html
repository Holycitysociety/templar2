<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Milites Templi</title>
  <meta name="description" content="Milites Templi — discreet custody, settlement, and protection." />

  <!-- Match browser chrome / overscroll to fabric off-white -->
  <meta name="theme-color" content="#f5f3ec" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Preload key images -->
  <link rel="preload" href="headerlogo.png" as="image" />
  <link rel="preload" href="logo.png" as="image" />
  <link rel="preload" href="background.png" as="image" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fixed, transparent header (above the bg image) -->
  <header class="site-header page-layer" role="banner">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Milites Templi home">
        <img src="headerlogo.png" alt="Milites Templi" class="brand-logo" />
      </a>

      <!-- Three-dot menu toggle (right side) -->
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="19" cy="12" r="2" />
        </svg>
      </button>

      <!-- Dropdown panel -->
      <div id="menu-panel" class="menu-panel" role="menu" aria-hidden="true">
        <a class="menu-link" role="menuitem" href="https://templar.gold" target="_blank" rel="noopener">Templar.Gold</a>
        <a class="menu-link" role="menuitem" href="https://uspolopatrons.org" target="_blank" rel="noopener">US Polo Patrons</a>
        <a class="menu-sublink" role="menuitem" href="https://charlestonpoloclub.com" target="_blank" rel="noopener">Charleston Polo Club</a>
      </div>
    </div>
  </header>

  <!-- Parallax background image (fixed behind everything) -->
  <img src="background.png" alt="" id="parallax-bg" aria-hidden="true" />

  <!-- Foreground content (above the bg image) -->
  <main id="content" class="page-layer">
    <!-- FULL-VIEWPORT HERO SECTION -->
    <section class="hero">
      <!-- The logo is positioned at a viewport-relative offset -->
      <div class="hero-anchor">
        <img src="logo.png" alt="Milites Templi crest" class="hero-logo" />
      </div>
    </section>

    <!-- Your additional sections (examples) -->
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>

    <section class="copyright-wrap">
      <div class="container">
        <p class="copyright">© 2025 Milites Templi. All rights reserved.</p>
      </div>
    </section>
  </main>

  <!-- Tiny script just for the dropdown menu -->
  <script>
    (function(){
      const toggle = document.querySelector('.menu-toggle');
      const panel  = document.getElementById('menu-panel');

      function openMenu(){
        panel.setAttribute('aria-hidden','false');
        toggle.setAttribute('aria-expanded','true');
        panel.classList.add('is-open');
        document.addEventListener('click', onDocClick);
        document.addEventListener('keydown', onKey);
      }
      function closeMenu(){
        panel.setAttribute('aria-hidden','true');
        toggle.setAttribute('aria-expanded','false');
        panel.classList.remove('is-open');
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onKey);
      }
      function onDocClick(e){
        if (!panel.contains(e.target) && !toggle.contains(e.target)) closeMenu();
      }
      function onKey(e){
        if (e.key === 'Escape') closeMenu();
      }

      toggle.addEventListener('click', (e)=>{
        e.stopPropagation();
        const open = panel.getAttribute('aria-hidden') === 'true';
        open ? openMenu() : closeMenu();
      });
    })();
  </script>

  <script src="script.js" defer></script>
</body>
</html>
