<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Milites Templi</title>
  <meta name="description" content="Milites Templi — discreet custody, settlement, and protection." />

  <!-- Match browser chrome / overscroll to fabric off-white -->
  <meta name="theme-color" content="#f5f3ec" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Preload key images -->
  <link rel="preload" href="headerlogo.png" as="image" />
  <link rel="preload" href="logo.png" as="image" />
  <link rel="preload" href="background.png" as="image" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fixed, transparent header (above the bg image) -->
  <header class="site-header page-layer" role="banner">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Milites Templi home">
        <img src="headerlogo.png" alt="Milites Templi" class="brand-logo" />
      </a>

      <!-- Existing ellipsis menu button (activated) -->
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="mt-menu">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="19" cy="12" r="2" />
        </svg>
      </button>

      <!-- Dropdown panel (right-aligned) -->
      <div id="mt-menu" class="menu-panel" role="menu" aria-label="Site menu">
        <ul class="menu-list">
          <li><a class="menu-link" role="menuitem" href="https://templer.gold" target="_blank" rel="noopener">TEMPLER.GOLD</a></li>
          <li><a class="menu-link" role="menuitem" href="https://uspolopatrons.org" target="_blank" rel="noopener">USPOLOPATRONS.ORG</a></li>
          <li><a class="menu-link menu-subitem" role="menuitem" href="https://charlestonpoloclub.com" target="_blank" rel="noopener">Charleston Polo Club</a></li>
        </ul>
      </div>

      <nav class="nav" aria-label="Primary"></nav>
    </div>
  </header>

  <!-- Parallax background image (fixed behind everything) -->
  <img src="background.png" alt="" id="parallax-bg" aria-hidden="true" />

  <!-- Foreground content (above the bg image) -->
  <main id="content" class="page-layer">
    <!-- FULL-VIEWPORT HERO SECTION -->
    <section class="hero">
      <!-- The logo is positioned at a viewport-relative offset -->
      <div class="hero-anchor">
        <img src="logo.png" alt="Milites Templi crest" class="hero-logo" />
      </div>
    </section>

    <!-- Your additional sections (examples) -->
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>
    <section class="section"><div class="container"></div></section>

    <section class="copyright-wrap">
      <div class="container">
        <p class="copyright">© 2025 Milites Templi. All rights reserved.</p>
      </div>
    </section>
  </main>

  <!-- Tiny inline menu JS: open/close, outside click, ESC -->
  <script>
    (function(){
      var toggle = document.querySelector('.menu-toggle');
      var panel  = document.getElementById('mt-menu');

      function openMenu(){
        panel.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
      }
      function closeMenu(){
        panel.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
      function toggleMenu(e){
        e.stopPropagation();
        if (panel.classList.contains('is-open')) { closeMenu(); } else { openMenu(); }
      }

      toggle.addEventListener('click', toggleMenu);

      // Close on outside click
      document.addEventListener('click', function(e){
        if (!panel.contains(e.target) && !toggle.contains(e.target)) {
          closeMenu();
        }
      });

      // Close on ESC
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape') closeMenu();
      });
    })();
  </script>

  <script src="script.js" defer></script>
</body>
</html>
